# ─────────────────────────────────────────────────────────────────────────────
# base_run_multi_format.yaml — replay a MIXED multi-turn CHAT trace (delay-driven).
#
# Trace was produced by the AIPerf delay-driven generator:
#   cd workload_scripts
#   python scripts/main/mixed_workload_gen_ai_perf.py \
#       --config configs/single_shared_multi_format/single30_multi70_agent0.yaml \
#       --out    single30_multi70_agent0.jsonl
#   (or run the whole sweep: ./scripts/gen_single_shared_multi_format.sh)
#
# The trace is AIPerf's native multi-turn format: one JSON object per line =
# one conversation session, e.g.
#   {"session_id": "...", "turns": [
#       {"timestamp": 12500, "text": "<head + first msg>", "output_length": 128, "extra": {"ignore_eos": true}},
#       {"delay": 60000,     "text": "<next user msg>",    "output_length": 64,  "extra": {"ignore_eos": true}}]}
# Turn 0 fires at its absolute `timestamp`; each follow-up turn fires `delay` ms
# AFTER the previous turn COMPLETES (no prefill/decode TPS model). --fixed-schedule
# handles both: it dispatches first turns at their timestamps and continuation
# turns via the delay-after-completion path.
#
# Copy the chosen trace to $HOME/$VOL_NAME/data/ on the machine before running.
# ─────────────────────────────────────────────────────────────────────────────

name: "smoke_test_multi_format"
results_root: "llm_bench_results"

setup:
  vol_name: ""        # ← set to the machine's data volume
  wandb_key: ""
  wandb_model_id: "google_gemma-4-26b-a4b-it:v0"
  model_local_path: "$HOME/$VOL_NAME/models/gemma"
  model_download_script: "scripts/download_models.py"

vllm:

  served_model_name: "gemma26b"
  cuda_visible_devices: "0,1,2,3"
  tensor_parallel_size: 4
  gpu_memory_utilization: 0.5
  max_model_len: "256K"
  dtype: "bfloat16"
  trust_remote_code: true
  enable_prefix_caching: true
  keep_alive: true
  block_size: 16
  repo: ""  # vLLM source repo to clone & build
  commit: ""
  torch_cuda_arch_list: "12.0+PTX"                 # A10G=8.6+PTX, L4=8.9+PTX
  install_script: "scripts/setup_vllm.sh"
  extra_args: [ "--enable-prompt-tokens-details"]

aiperf:
  # Mixed multi-turn CHAT trace from mixed_workload_gen_ai_perf.py. Pick any combo
  # from the single_shared_multi_format sweep; swap the filename to change the mix.
  input_file: "$HOME/$VOL_NAME/data/single30_multi70_agent0.jsonl"
  custom_dataset_type: "multi_turn"       # nested {session_id, turns:[...]} sessions
  endpoint_type: "chat"                   # accumulates message history + threads live
  endpoint: "/v1/chat/completions"        #   assistant replies across turns (Layer-2 KV reuse)
  slice_duration: 10
  export_level: "raw"
  export_http_trace: true
  streaming: true
  fixed_schedule: true                    # turn 0 @ timestamp; follow-ups @ delay-after-completion
  tokenizer: "$HOME/$VOL_NAME/models/gemma"   # aiperf needs it for ISL/OSL metrics
  # Per-turn output_length + extra.ignore_eos are baked into the trace, so no global
  # --osl / --output-tokens flags are needed (the server emits exactly output_length).
  extra_args: ["--use-server-token-count"]

# ── Push results (metrics + plots + raw aiperf/vLLM exports) to W&B ───────────
wandb_logging:
  enabled: true
  entity: ""
  project: "wakman"